<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Form - FormEasy</title>
    <style>
      body { font-family: -apple-system, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; }
      .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
      h1 { margin-top: 0; font-size: 24px; color: #111827; }
      .form-group { margin-bottom: 20px; }
      label { display: block; font-weight: 500; margin-bottom: 8px; color: #374151; font-size: 14px; }
      input, select { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
      input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
      button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 500; cursor: pointer; width: 100%; font-size: 16px; }
      button:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Government Scholarship Application</h1>
      <form id="demo-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="As per official records" />
        </div>
        <div class="form-group">
          <label for="corr-address">Correspondence Address</label>
          <input type="text" id="corr-address" />
        </div>
        <div class="form-group">
          <label for="perm-address">Permanent Address</label>
          <input type="text" id="perm-address" />
        </div>
        <div class="form-group">
          <label for="income">Annual Family Income</label>
          <input type="text" id="income" />
        </div>
        <div class="form-group">
          <label for="domicile">Domicile</label>
          <select id="domicile">
            <option value="">Select State</option>
            <option value="ap">Andhra Pradesh</option>
            <option value="ts">Telangana</option>
            <option value="ka">Karnataka</option>
          </select>
        </div>
        <div class="form-group">
          <label for="issuing-authority">Issuing Authority</label>
          <input type="text" id="issuing-authority" />
        </div>
        <div class="form-group">
          <label for="reg-no">Registration Number</label>
          <input type="text" id="reg-no" />
        </div>
        <div class="form-group">
          <label for="ifsc">IFSC</label>
          <input type="text" id="ifsc" />
        </div>
        <div class="form-group">
          <label for="date-issue">Date of Issue</label>
          <input type="date" id="date-issue" />
        </div>
        <div class="form-group">
          <label for="date-expiry">Date of Expiry</label>
          <input type="date" id="date-expiry" />
        </div>
        <div class="form-group">
          <label for="nominee">Nominee</label>
          <input type="text" id="nominee" />
        </div>
        <div class="form-group">
          <label for="occupation">Occupation</label>
          <input type="text" id="occupation" />
        </div>
        <button type="button" onclick="alert('Demo submitted')">Submit Application</button>
      </form>
    </div>
  </body>
</html>
